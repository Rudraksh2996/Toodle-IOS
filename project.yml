name: Toodle
options:
  bundleIdPrefix: com.toodle
  deploymentTarget:
    iOS: '17.0'
packages:
  ToodleCore:
    path: Packages/ToodleCore
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Toodle:
    type: application
    platform: iOS
    sources: [Toodle]
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toodle.ios
        INFOPLIST_FILE: Toodle/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ToodleCore
  ToodleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ToodleUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Toodle
schemes:
  Toodle:
    build:
      targets:
        Toodle: all
        ToodleUITests: [test]
    test:
      targets: [ToodleUITests]
